
services:
  mern-backend:
    build:
      context: ./server
    container_name: mern-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: ${MONGO_URI}
    ports:
      - "5000:5000"

  mern-frontend:
    build:
      context: ./client
    container_name: mern-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - mern-backend
