apiVersion: apps/v1
kind: Deployment
metadata:
  name: mern-backend
  namespace: mern
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mern-backend
  template:
    metadata:
      labels:
        app: mern-backend
    spec:
      containers:
      - name: mern-backend
        image: aadu949/mern-server:46
        ports:
        - containerPort: 5000
        env:
        - name: PORT
          value: "5000"
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: mongo-secret
              key: MONGO_URI
---
apiVersion: v1
kind: Service
metadata:
  name: mern-backend
  namespace: mern
spec:
  type: ClusterIP
  selector:
    app: mern-backend
  ports:
  - port: 5000
    targetPort: 5000
