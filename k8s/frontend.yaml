
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mern-frontend
  namespace: mern
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mern-frontend
  template:
    metadata:
      labels:
        app: mern-frontend
    spec:
      containers:
      - name: mern-frontend
        image: aadu949/mern-client:46
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: mern-frontend
  namespace: mern
spec:
  type: NodePort
  selector:
    app: mern-frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
